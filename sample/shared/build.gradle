import com.jibru.kostra.plugin.ResourcesDefaults

plugins {
    id("org.jetbrains.kotlin.multiplatform")
    id("com.android.kotlin.multiplatform.library")
    id("org.jetbrains.compose")
    id("org.jetbrains.kotlin.plugin.compose")
    id("org.jetbrains.kotlin.native.cocoapods")
    id("com.jibru.kostra.resources")
}

apply from: "$rootProject.projectDir/../build-ktlint.gradle"
apply from: "$rootProject.projectDir/../build-android-lib.gradle"

def depModules = [project(":shared-lib1"), project(":shared-lib2")]

kotlin {
    jvm()
    android {
        namespace = "com.jibru.kostra.appsample"
    }
    cocoapods {
        version = "1.0.0"
        summary = "Some description for the Shared Module"
        homepage = "Link to the Shared Module homepage"
        ios.deploymentTarget = "14.1"
        podfile = project.file("../appIos/Podfile")
        framework {
            baseName = "shared"
            binaryOption("bundleId", "com.jibru.kostra.sample.shared")
            binaryOption("bundleVersion", "2")
            isStatic = true
        }
    }

    iosArm64()
    iosSimulatorArm64()

    applyDefaultHierarchyTemplate()

    sourceSets {
        commonMain {
            dependencies {
                implementation(libs.kostra.common)
                implementation(libs.kostra.compose)
                implementation(libs.bundles.jetbrains.compose.app)
                implementation(libs.jetbrains.compose.ui.tooling.preview)

                //api necessary for cocoapods export
                depModules.forEach {
                    api(it)
                }
            }
        }

        commonTest {
            dependencies {
                implementation(kotlin("test"))
            }
        }

        jvmMain
        androidMain

        iosMain {
            sourceSets {
                //KMP doesn't merge a sub-project's iosMain.resources into a consumer's static
                //framework, and the iOS runtime reads <app>/compose-resources/kostra_resources/<key>.
                //Pull each dep module's generated kostra assets (string/plural DBs + staged binary
                //files, already under kostra_resources/) into shared's iosMain. The generated dir is
                //a BUILD OUTPUT of <p>:generateDatabases; the generateDatabases.dependsOn(...) at the
                //bottom guarantees it's populated before any iOS resource packaging runs, so a srcDir
                //that doesn't exist yet at sync time (treated as empty) is fine.
                depModules.forEach { Project p ->
                    def genResources = new File(p.layout.getBuildDirectory().get().asFile, "generated/kostra/assets")
                    resources.srcDirs(genResources)
                }
            }
        }

    }
}

kostra {
    KClassName = "com.sample.app.K"
    interfaces = true
    resourcesDefaults.value(ResourcesDefaults.values().toList())
    //Sample resources intentionally exercise partial-translation cases
    //(`en-rUS` / `en-rGB` variants without a separate base `en.xml`), so
    //strict-mode coverage flags them as missing. Disable so the demo build
    //stays green — the production behaviour is tested via the kostra plugin's
    //own test suite, not via this sample.
    strictMode = false
    androidResources {
        painterGroups.add("flags.*")
        keyMapper { key, file -> key }
        //just to let plugin know about extra resources,
        //strings are transformed to own DB and don't need to be part of APK as xmls
        resourceDirs.add(file("src/commonMain/resources_strings"))
    }
}


//just ensure that lib DBs are created with 'shared' module DB
tasks.getByName("generateDatabases")
    .dependsOn(":shared-lib1:generateDatabases", ":shared-lib2:generateDatabases")

//Android Studio renders previews by instantiating composables against the
//Android target's runtime classpath. `ui-tooling` is the preview-runtime
//library (LayoutInflater stubs, preview-only CompositionLocals, etc.). With
//the AGP-9 `com.android.kotlin.multiplatform.library` plugin the right
//configuration is `androidRuntimeClasspath` (the older Android Gradle Plugin
//variant `debugImplementation` doesn't exist on the new plugin — see the
//"Compose UI Previews in KMP" doc). Guarded by `plugins.withId` so modules
//that opt into this convention but don't apply the new Android KMP plugin
//skip the wiring silently instead of failing at config time with
//"configuration not found".
plugins.withId("com.android.kotlin.multiplatform.library") {
    dependencies {
        androidRuntimeClasspath(libs.jetbrains.compose.ui.tooling)
    }
}
