name: Kostra CI

on:
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  kostraCI:
#    runs-on: ubuntu-latest
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          #keep caching only for github hosts, as the cache is being there
#          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Grant execute permission for sample/gradlew
        run: chmod +x sample/gradlew
      - name: KtlintCheck
        run: sample/gradlew ktlintCheck
      - name: Build & Test
        run: ./gradlew allTest test build
      - name: Build & Test Sample
        run: sample/gradlew clean allTest test build

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Test Results
          path: '**/build/test-results/**/TEST-*.xml'
          reporter: java-junit
          list-suites: all
          list-tests: all
          fail-on-error: false
          fail-on-empty: false

      - name: Test Report Sample
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Test Results Sample
          path: 'sample/**/build/test-results/**/TEST-*.xml'
          reporter: java-junit
          list-suites: all
          list-tests: all
          fail-on-error: false
          fail-on-empty: false
